name: CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        run: |
          SHA=${GITHUB_SHA::8}
          for svc in user-service product-service search-service order-service review-service cart-service notification-service storefront; do
            echo "--- ${svc} ---"
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --tag ghcr.io/${{ github.repository_owner }}/${svc}:${SHA} \
              --tag ghcr.io/${{ github.repository_owner }}/${svc}:latest \
              --push \
              ./app/${svc}
          done
