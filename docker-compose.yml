name: stackshop

services:

  # ── Infrastructure ─────────────────────────────────────────────────────────
  # Provided for you. The application services go below.

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "ruok,srvr,stat"
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep -q Mode"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  elasticsearch:
    image: elasticsearch:8.13.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -v '\"status\":\"red\"'"]
      interval: 10s
      timeout: 10s
      retries: 15

  # ── Application Services ───────────────────────────────────────────────────
  # Add each service below. Reference card:
  #
  # user-service
  #   build: ./app/user-service
  #   port: "8001:8001"
  #   env: PORT=8001, DB_URL=postgres://...@postgres:5432/users, JWT_SECRET
  #   depends_on: postgres (service_healthy)
  #
  # product-service
  #   build: ./app/product-service
  #   port: "8002:8002"
  #   env: PORT=8002, DB_URL, MONGO_URL, MONGO_DB, KAFKA_BROKERS, JWT_SECRET
  #   depends_on: postgres, mongodb, kafka (all service_healthy)
  #
  # order-service
  #   build: ./app/order-service
  #   port: "8003:8003"
  #   env: PORT=8003, DB_URL (asyncpg), KAFKA_BROKERS, JWT_SECRET, PRODUCT_SERVICE_URL
  #   depends_on: postgres, kafka (service_healthy)
  #
  # cart-service
  #   build: ./app/cart-service
  #   port: "8004:8004"
  #   env: PORT=8004, REDIS_URL, JWT_SECRET
  #   depends_on: redis (service_healthy)
  #
  # notification-service
  #   build: ./app/notification-service
  #   env: KAFKA_BROKERS
  #   depends_on: kafka (service_healthy)
  #
  # search-service
  #   build: ./app/search-service
  #   port: "8005:8005"
  #   env: PORT=8005, ELASTICSEARCH_URL, KAFKA_BROKERS
  #   depends_on: elasticsearch, kafka (service_healthy)
  #
  # review-service
  #   build: ./app/review-service
  #   port: "8006:8006"
  #   env: PORT=8006, MONGO_URL, MONGO_DB, JWT_SECRET
  #   depends_on: mongodb (service_healthy)
  #
  # storefront
  #   build: ./app/storefront
  #   port: "3000:3000"
  #   env: NEXT_PUBLIC_*_SERVICE_URL=http://localhost:800x, INTERNAL_*_URL
  #   depends_on: all six services above

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  es_data:
