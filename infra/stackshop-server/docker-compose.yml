name: stackshop

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────
  # These are provided for you — same as Section 4.

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init.sh:/docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "ruok,srvr,stat"
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep -q Mode"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  elasticsearch:
    image: elasticsearch:8.13.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -v '\"status\":\"red\"'"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ── Application ─────────────────────────────────────────────────────────────

  user-service:
    image: ${REGISTRY}/user-service:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/users?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      PORT: 8001
    ports:
      - "8001:8001"
    # Traefik - next lecture. Remove the ports above, then uncomment and
    # adjust this block for every service. Change the router name, the path,
    # and the port. Attach each service to the "proxy" network too.
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.user.rule=Host(`${DOMAIN}`) && PathPrefix(`/api/users`)"
    #   - "traefik.http.routers.user.entrypoints=websecure"
    #   - "traefik.http.routers.user.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.user.loadbalancer.server.port=8001"
    # networks:
    #   - default
    #   - proxy

  product-service:
    image: ${REGISTRY}/product-service:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/products?sslmode=disable
      MONGO_URL: mongodb://mongodb:27017
      MONGO_DB: stackshop
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      PORT: 8002
    ports:
      - "8002:8002"

  order-service:
    image: ${REGISTRY}/order-service:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/orders
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      PRODUCT_SERVICE_URL: http://product-service:8002
      PORT: 8003
    ports:
      - "8003:8003"

  cart-service:
    image: ${REGISTRY}/cart-service:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      PORT: 8004
    ports:
      - "8004:8004"

  search-service:
    image: ${REGISTRY}/search-service:latest
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      KAFKA_BROKERS: kafka:9092
      PORT: 8005
    ports:
      - "8005:8005"

  notification-service:
    image: ${REGISTRY}/notification-service:latest
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9092

  review-service:
    image: ${REGISTRY}/review-service:latest
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://mongodb:27017
      MONGO_DB: stackshop
      JWT_SECRET: ${JWT_SECRET}
      PORT: 8006
    ports:
      - "8006:8006"

  storefront:
    image: ${REGISTRY}/storefront:latest
    restart: unless-stopped
    depends_on:
      - user-service
      - product-service
      - order-service
      - cart-service
      - search-service
      - review-service
    environment:
      NEXT_PUBLIC_USER_SERVICE_URL: http://${SERVER_IP}:8001
      NEXT_PUBLIC_PRODUCT_SERVICE_URL: http://${SERVER_IP}:8002
      NEXT_PUBLIC_ORDER_SERVICE_URL: http://${SERVER_IP}:8003
      NEXT_PUBLIC_CART_SERVICE_URL: http://${SERVER_IP}:8004
      NEXT_PUBLIC_SEARCH_SERVICE_URL: http://${SERVER_IP}:8005
      NEXT_PUBLIC_REVIEW_SERVICE_URL: http://${SERVER_IP}:8006
      INTERNAL_PRODUCT_SERVICE_URL: http://product-service:8002
      INTERNAL_SEARCH_SERVICE_URL: http://search-service:8005
    ports:
      - "3000:3000"

networks:
  default:

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  es_data:
