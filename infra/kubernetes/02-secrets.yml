apiVersion: v1
kind: Secret
metadata:
  name: stackshop-secrets
  namespace: stackshop
type: Opaque
# stringData accepts plain text values - Kubernetes handles base64 encoding
stringData:
  POSTGRES_USER: "YOUR_POSTGRES_USER"
  # The password is embedded in each service's DB_URL. Avoid URL-special
  # characters (@ : / # ?) - they break URL parsing and crash the services.
  POSTGRES_PASSWORD: "YOUR_STRONG_POSTGRES_PASSWORD"
  JWT_SECRET: "YOUR_JWT_SECRET"
