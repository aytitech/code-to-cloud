apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: stackshop
  namespace: stackshop
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      port: 8000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stackshop
  namespace: stackshop
spec:
  parentRefs:
    - name: stackshop
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/users
      backendRefs:
        - name: user-service
          port: 8001
    - matches:
        - path:
            type: PathPrefix
            value: /api/products
      backendRefs:
        - name: product-service
          port: 8002
    - matches:
        - path:
            type: PathPrefix
            value: /api/reviews
      backendRefs:
        - name: review-service
          port: 8006
    - matches:
        - path:
            type: PathPrefix
            value: /api/orders
      backendRefs:
        - name: order-service
          port: 8003
    - matches:
        - path:
            type: PathPrefix
            value: /api/cart
      backendRefs:
        - name: cart-service
          port: 8004
    - matches:
        - path:
            type: PathPrefix
            value: /api/search
      backendRefs:
        - name: search-service
          port: 8005
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: storefront
          port: 3000
