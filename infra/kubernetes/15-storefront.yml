apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: stackshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      containers:
        - name: storefront
          image: ghcr.io/YOUR_GITHUB_USERNAME/storefront:latest
          ports:
            - containerPort: 3000
          env:
            # Public URLs - the browser calls the single origin, and the Gateway routes by path.
            # Replace YOUR_DOMAIN with your actual domain.
            - name: NEXT_PUBLIC_USER_SERVICE_URL
              value: "https://YOUR_DOMAIN"
            - name: NEXT_PUBLIC_PRODUCT_SERVICE_URL
              value: "https://YOUR_DOMAIN"
            - name: NEXT_PUBLIC_ORDER_SERVICE_URL
              value: "https://YOUR_DOMAIN"
            - name: NEXT_PUBLIC_CART_SERVICE_URL
              value: "https://YOUR_DOMAIN"
            - name: NEXT_PUBLIC_SEARCH_SERVICE_URL
              value: "https://YOUR_DOMAIN"
            - name: NEXT_PUBLIC_REVIEW_SERVICE_URL
              value: "https://YOUR_DOMAIN"
            # Internal URLs - used by Next.js server-side code inside the cluster.
            - name: INTERNAL_PRODUCT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: stackshop-config
                  key: PRODUCT_SERVICE_URL
            - name: INTERNAL_SEARCH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: stackshop-config
                  key: SEARCH_SERVICE_URL
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: stackshop
spec:
  selector:
    app: storefront
  ports:
    - port: 3000
      targetPort: 3000
