apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: stackshop-alerts
  namespace: default
  labels:
    release: monitoring
spec:
  groups:
    - name: stackshop
      rules:
        - alert: StackShopServiceDown
          expr: sum(kube_deployment_status_replicas_ready{namespace="stackshop"}) by (deployment) == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.deployment }} has no ready replicas"
            description: "{{ $labels.deployment }} in stackshop has been down for over a minute."

