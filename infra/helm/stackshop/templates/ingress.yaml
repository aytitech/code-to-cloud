apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stackshop
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: traefik
  rules:
{{- range .Values.ingressHosts }}
    - host: {{ .host }}.{{ $.Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .service }}
                port:
                  number: {{ .port }}
{{- end }}
